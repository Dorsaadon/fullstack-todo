# Real venues. Start in paper mode: live market data, simulated fills.
#   cp config/example.toml config/local.toml   (local.toml is gitignored)
#   python -m tradebot check -c config/local.toml
#   python -m tradebot run   -c config/local.toml
#
# Going live requires engine.mode = "live" here AND the --live flag.
# Secrets come from environment variables (or a .env file), never this file.

[engine]
mode = "paper"
data_mode = "stream"           # WebSockets where the venue has them; "poll" = REST only
heartbeat_s = 1                # re-check equity and risk at least this often
min_tick_interval_s = 0.05     # coalesce bursts of updates before running strategies
balance_refresh_s = 30         # balances also refresh after every trade
poll_interval_s = 2            # REST cadence for venues without WebSockets
book_depth = 10
journal = "data/journal.jsonl"
unwind_slippage_bps = 50
state_file = "data/state.json"  # halts, daily-loss baseline, open positions, paper balances
state_save_s = 10               # also saved after every trade and on every halt

# Alerts to your phone. Secrets come from .env; leave a channel out to disable it.
[alerts]
telegram_token_env = "TELEGRAM_BOT_TOKEN"
telegram_chat_id_env = "TELEGRAM_CHAT_ID"
slack_webhook_env = "SLACK_WEBHOOK_URL"
healthcheck_url_env = "HEALTHCHECK_URL"   # e.g. a healthchecks.io check, period 1 min, grace 3 min
min_level = "warning"                     # info | warning | critical
daily_summary_time = "16:10"              # America/New_York; always sent

# Record every book update while trading, for backtests (`tradebot backtest`).
# Or collect data without trading: `tradebot record -c config/local.toml`.
[recording]
enabled = false
path = "data/recordings"       # one gzip file per UTC day
min_interval_s = 0             # >0 downsamples each book (smaller files, coarser replay)

[risk]
max_order_notional = 500       # USD per order
max_position_notional = 2000   # USD per asset per venue
max_daily_loss = 100           # halts for the day (until restart) once hit
max_orders_per_minute = 20
max_book_age_s = 3
min_plan_profit = 0.10         # USD; skip arbs too small to beat noise
kill_switch_file = "data/KILL" # `touch data/KILL` stops all trading (works from the host with Docker too)

# --- Crypto -----------------------------------------------------------------
# US residents: use exchange_id = "binanceus". Check the fee tier on your account.
[venues.binance]
kind = "ccxt"
exchange_id = "binance"
quote_currency = "USDT"
taker_fee = 0.001
sandbox = false                # true = Binance spot testnet (separate API keys)
api_key_env = "BINANCE_API_KEY"
secret_env = "BINANCE_API_SECRET"
paper_balances = { USDT = 5000, BTC = 0.05, ETH = 1 }

[venues.kraken]
kind = "ccxt"
exchange_id = "kraken"
quote_currency = "USDT"
taker_fee = 0.0026
api_key_env = "KRAKEN_API_KEY"
secret_env = "KRAKEN_API_SECRET"
paper_balances = { USDT = 5000, BTC = 0.05 }

# --- US equities ------------------------------------------------------------
# Optional: closures the calendar can't predict (national days of mourning...).
[market_calendar]
extra_holidays = []            # e.g. ["2025-01-09"]
extra_early_closes = []

[venues.alpaca]
kind = "alpaca"
market_hours = "us_equities"   # orders refused outside regular hours (the default for alpaca)
# Shorting: live, it needs an Alpaca margin account (and shares available to
# borrow). Off by default; then any sell that would go below zero is refused.
allow_short = false
short_initial_margin = 0.5     # paper: Reg T, cash must cover 150% of open shorts
borrow_rate_annual = 0.003     # paper: easy-to-borrow rate; hard-to-borrow names cost far more
paper_account = true           # Alpaca's own paper account; false = real money
feed = "iex"                   # "sip" needs a paid data plan
api_key_env = "ALPACA_API_KEY"
secret_env = "ALPACA_API_SECRET"
paper_balances = { USD = 10000 }

# --- Prediction markets -------------------------------------------------------
# Symbols are CLOB token ids (one per outcome); find them via
# https://gamma-api.polymarket.com/markets?slug=<market-slug> ("clobTokenIds").
[venues.polymarket]
kind = "polymarket"
taker_fee = 0
private_key_env = "POLYMARKET_PRIVATE_KEY"
funder_env = "POLYMARKET_FUNDER"   # proxy wallet address, if you use one
signature_type = 1                 # 0 = EOA, 1 = email/Magic, 2 = browser-wallet Safe
paper_balances = { USDC = 1000 }

[[strategies]]
kind = "cross_exchange_arb"
name = "btc-cross-arb"
symbol = "BTC/USDT"
venues = ["binance", "kraken"]
min_edge_bps = 15
max_size = 0.005

[[strategies]]
kind = "triangular_arb"
name = "usdt-btc-eth-tri"
venue = "binance"
path = ["USDT", "BTC", "ETH"]
markets = ["BTC/USDT", "ETH/USDT", "ETH/BTC"]
min_edge_bps = 10
max_start_amount = 200

[[strategies]]
kind = "prediction_market_arb"
name = "pm-basket"
venue = "polymarket"
outcomes = ["<YES_TOKEN_ID>", "<NO_TOKEN_ID>"]
min_edge_bps = 50
max_size = 50

[[strategies]]
kind = "opening_range_breakout"
name = "orb"
venue = "alpaca"
symbols = ["SPY", "QQQ", "NVDA"]
range_minutes = 15
entry_cutoff_minutes = 120     # no new entries after 11:30 ET
flatten_minutes_before_close = 5
breakout_buffer_bps = 5
min_range_bps = 20             # skip dead-flat opens
max_range_bps = 300            # skip opens too wild to size sensibly
risk_per_trade = 25            # USD lost if the stop is hit
max_position_notional = 2000
take_profit_r = 2              # 0 = hold until the flatten time
max_slippage_bps = 10
allow_short = false            # true = also short breakdowns (needs allow_short on the venue)

[[strategies]]
kind = "mean_reversion"
name = "spy-meanrev"
venue = "alpaca"
symbol = "SPY"
window = 60                    # samples, one per sample_interval_s
sample_interval_s = 1
entry_z = 2.0
exit_z = 0.0
order_size = 1
