[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Multi-venue, multi-strategy trading bot (US equities, crypto, prediction markets)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crypto = ["ccxt>=4.4"]
stocks = ["alpaca-py>=0.40", "websockets>=13"]
polymarket = ["py-clob-client>=0.34", "websockets>=13"]
all = ["ccxt>=4.4", "alpaca-py>=0.40", "py-clob-client>=0.34", "websockets>=13"]
dev = ["pytest>=8", "websockets>=13"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
